usage       = "infer --model asia.uai --evidence AD --out artifacts/AD"
description = "infer probabilities from local factors; no unstated defaults"

[args]
model    = "path to the ASIA UAI model data"
evidence = "prior: no observations; AD: A=0,D=0; ADX: A=0,D=0,X=0"
out      = "directory for this run's evidence"

[writes]
# Keep enumeration and contraction results at full precision for comparison.
"<out>/run.json" = "observations, evidence mass, node marginals and T,L joint"
stdout          = "evidence probability, disease probabilities and discrepancies"

[args.ordering]
order   = "scalar evidence order: random or greedy; default greedy"
seed    = "random-order seed; required with random, absent otherwise"
plan    = "replay a saved scalar-query plan; default absent"
analyze = "analyse a saved plan without contraction; default absent"

[writes.ordering]
# Save enough information to replay the plan and independently recount its cost.
"<out>/order.json"      = "contraction plan, planning method and random seed"
"<out>/complexity.json" = """
Work: sum of pair costs, each the product of dimensions in the union of input labels.
Largest tensor: maximum entry count among all inputs and intermediates.
Include per-step costs and retained labels for independent recounting.
"""
# order, plan and analyze are mutually exclusive.
# Analysis writes costs without inference; inference also saves its scalar plan.

[args.bp]
method     = "inference method: exact or bp; default exact"
damping    = "fraction of the proposed message used; required with bp only"
tolerance  = "maximum undamped residual for stopping; required with bp only"
max-sweeps = "iteration limit, not a convergence claim; required with bp only"

[writes.bp]
# Estimate probabilities for the same model and observations as exact inference.
# Record enough history to compare BP's convergence, accuracy and cost.
"<out>/run.json" = """
Observations, BP settings and final marginals.
At each sweep: node beliefs, undamped residual and cumulative update work.
Normalize every message proposal. Compute the maximum absolute undamped message
change at the same state as the recorded beliefs, including the returned state.
"""
stdout          = "BP sweep, undamped residual and cumulative update work"

# Application block (UAI 2014 Promedus_14; extends the blocks above):
#   --evidence <path.uai.evid>   observations from the downloaded evidence file
#   --order treesa               omeco TreeSA, time-only score, seeded by the
#                                trial index; search settings saved in order.json
#   --query 59,102,139           variables whose marginals are contracted
#   --pr <file.uai.PR>           compare log10 Z_E with the published PR (tol 1e-4)
#   --mar <file.uai.MAR>         compare state-ordered marginals with MAR (tol 1e-5)
# Large-graph BP traces record per-sweep residual/work plus the queried
# variables' beliefs; runtime and update work are saved in run.json.
